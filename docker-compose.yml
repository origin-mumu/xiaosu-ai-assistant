name: xiaosu

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: xiaosu
      POSTGRES_USER: xiaosu
      POSTGRES_PASSWORD: xiaosu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaosu -d xiaosu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://xiaosu:xiaosu@postgres:5432/xiaosu
      LOG_DIR: /app/logs
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  bot:
    image: xiaosu-api
    command: ["python", "-m", "xiaosu.im.worker"]
    profiles: ["dingtalk"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://xiaosu:xiaosu@postgres:5432/xiaosu
      LOG_DIR: /app/logs
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
